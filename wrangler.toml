name = "novelist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = "./worker/index.ts"
# Public workers.dev / preview URLs are disabled in every env to keep the
# Gemini API key from being abused via the default subdomains. Reach the
# worker through your own custom domain instead.
preview_urls = false
workers_dev = false

[assets]
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
# GEMINI_API_KEY is a secret — set it with: bunx wrangler secret put GEMINI_API_KEY
# OpenAI-compatible API (optional). The model list comes from GET <base>/models.
# Keep both values on the server only; the UI just shows whether they are set.
#   bunx wrangler secret put OPENAI_BASE_URL   (e.g. https://host/v1)
#   bunx wrangler secret put OPENAI_API_KEY
# For local dev, set them in the Worker's local secrets file (see the wrangler docs).
# OPENAI_API_FORMAT is "chat" (default, /chat/completions) or "responses" (/responses).

# D1 binding for novel storage. Local dev uses an in-tree SQLite under
# .wrangler/state/, so the placeholder is fine during dev.
[[d1_databases]]
binding = "DB"
database_name = "novelist"
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

# 章本文生成セッション (1 章 1 instance, SQLite-backed = Workers Free 枠で動く)
[[durable_objects.bindings]]
name = "CHAPTER_GEN"
class_name = "ChapterGenerationDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChapterGenerationDO"]

# ── staging (deployed on PR merge to develop) ──
[env.staging]
name = "novelist-staging"
preview_urls = false
workers_dev = false
routes = [
  { pattern = "novel-staging.qleap.jp", custom_domain = true }
]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
GEMINI_MODEL = "gemini-2.5-flash"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "novelist-staging"
database_id = "169253a8-8421-4de2-83ed-6ff2727768a0"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

[[env.staging.durable_objects.bindings]]
name = "CHAPTER_GEN"
class_name = "ChapterGenerationDO"

# ── production (deployed on PR merge to master) ──
[env.production]
name = "novelist-production"
preview_urls = false
workers_dev = false
routes = [
  { pattern = "novel.qleap.jp", custom_domain = true }
]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.vars]
GEMINI_MODEL = "gemini-2.5-flash"

[[env.production.d1_databases]]
binding = "DB"
database_name = "novelist-production"
database_id = "48501a98-987a-45e6-b6e5-14144656eba0"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

[[env.production.durable_objects.bindings]]
name = "CHAPTER_GEN"
class_name = "ChapterGenerationDO"
