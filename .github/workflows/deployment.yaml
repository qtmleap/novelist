name: Deploy to Cloudflare Workers (vinext)
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    name: Vinext Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uncomment when the project uses Prisma (or similar codegen).
      # - name: Generate Prisma client
      #   run: bun run prisma generate

      - name: Vinext build
        run: bunx vinext build

      - name: Deploy via @vinext/cloudflare
        run: bunx @vinext/cloudflare deploy
